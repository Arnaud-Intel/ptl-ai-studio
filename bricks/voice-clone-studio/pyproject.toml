[project]
name = "voice-clone-studio"
version = "0.1.0"
description = "Zero-shot voice cloning: enroll a short voice sample, then synthesize any text in that voice, with a switchable PyTorch / OpenVINO backend."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "numpy>=1.26",
    "torch>=2.2",
    "torchaudio>=2.2",
    "librosa>=0.10",
    "pydub>=0.25",
    # pydub imports the stdlib `audioop` module, removed in Python 3.13
    # (PEP 594) -- without this, importing this brick (and anything that
    # composes it, e.g. voice-assistant) crashes on 3.13+ with
    # "ModuleNotFoundError: No module named 'audioop'". audioop-lts is the
    # official backport, published by the CPython maintainers for exactly
    # this migration; it only installs where it's actually needed since
    # audioop is still stdlib below 3.13.
    "audioop-lts>=0.2; python_version >= '3.13'",
    "soundfile>=0.12",
    "anyascii>=0.3",
    "inflect>=7.0",
    "eng-to-ipa>=0.0.2",
    "wavmark>=0.0.3",
    "huggingface_hub>=0.24",
    # Chatterbox-Turbo runs as four ONNX graphs; `tokenizers` alone reads
    # its tokenizer.json, which is all we need -- pulling `transformers`
    # for that one call would cost ~200MB of dependency for byte-identical
    # ids (verified against AutoTokenizer before dropping it).
    "onnxruntime>=1.17",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
openvino = [
    "openvino>=2024.4",
]

[project.scripts]
voice-clone-studio = "voice_clone_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone_studio"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
# CPU-only wheels straight from PyTorch's own index, same reasoning as
# doc-qa's llama-cpp-python-cpu: skip a multi-GB CUDA build we'd never use.
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
