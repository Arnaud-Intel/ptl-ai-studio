[project]
name = "portrait-studio"
version = "0.1.0"
description = "EXPERIMENTAL. Takes a photo of a person and draws the same person again in a chosen style -- a cartoon, a corporate headshot, a manga panel -- with an image-editing model (FLUX.2 klein 4B) on the integrated GPU."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# There is no portable engine here: the image model runs through OpenVINO only,
# and FLUX.2 klein needs the pipelines of 2026.3 or later.
openvino = [
    "openvino>=2026.4.1",
    "openvino-genai>=2026.4.1",
]

[project.scripts]
portrait-studio = "portrait_studio.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portrait_studio"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
