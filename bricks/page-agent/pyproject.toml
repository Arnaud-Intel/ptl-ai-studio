[project]
name = "page-agent"
version = "0.1.0"
description = "EXPERIMENTAL. Turns a one-line request into an illustrated, self-contained web page by putting three models to work on three chips: a small model plans it, an image model draws its pictures, a coding model writes the HTML. Composes doc-qa and html-creator; the image model is the only new one."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "doc-qa",
    "html-creator",
    "pillow",
]

[project.optional-dependencies]
# There is no portable engine here: the image model runs through OpenVINO only.
openvino = [
    "doc-qa[openvino]",
    "html-creator[openvino]",
]

[project.scripts]
page-agent = "page_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/page_agent"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
doc-qa = { workspace = true }
html-creator = { workspace = true }
