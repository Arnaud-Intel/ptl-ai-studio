[project]
name = "screen-ocr"
version = "0.1.0"
description = "Local text extraction from a screenshot, webcam frame, or uploaded photo, with optional translation to English."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "numpy>=1.26",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
openvino = [
    "openvino>=2024.4",
    "openvino-genai>=2024.4",
    "huggingface_hub>=0.24",
]

[project.scripts]
screen-ocr = "screen_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_ocr"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
