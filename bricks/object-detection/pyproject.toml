[project]
name = "object-detection"
version = "0.1.0"
description = "Local object detection overlay (webcam or screen capture), with a switchable ONNX Runtime / OpenVINO backend."
requires-python = ">=3.11"
dependencies = [
    "pantherlake-ai-core",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
openvino = [
    "openvino>=2024.4",
    "openvino-model-api[huggingface]>=0.4",
]

[project.scripts]
object-detect = "object_detection.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/object_detection"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
