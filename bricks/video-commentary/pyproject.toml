[project]
name = "video-commentary"
version = "0.1.0"
description = "EXPERIMENTAL. A vision-language model watches a video and says what is happening, a line every few seconds; a small language model gives each line a mood. Composes screen-ocr (the vision model) and doc-qa (the language model): no model of its own."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "screen-ocr",
    "doc-qa",
    "voice-clone-studio",  # the voices a line is said aloud in
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
# There is no portable engine here: the vision-language model runs through OpenVINO only.
openvino = [
    "screen-ocr[openvino]",
    "doc-qa[openvino]",
    "voice-clone-studio[openvino]",
]

[project.scripts]
video-commentary = "video_commentary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_commentary"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
screen-ocr = { workspace = true }
doc-qa = { workspace = true }
voice-clone-studio = { workspace = true }
