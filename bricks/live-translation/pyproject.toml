[project]
name = "live-translation"
version = "0.2.0"
description = "Local speech-to-text translation (mic or system audio) into English, with a switchable faster-whisper / OpenVINO backend."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "faster-whisper>=1.0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
openvino = [
    "openvino>=2024.4",
    "openvino-genai>=2024.4",
    "huggingface_hub>=0.24",
]

[project.scripts]
live-translate = "live_translation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_translation"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
