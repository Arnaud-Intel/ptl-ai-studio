[project]
name = "smart-city-monitor"
version = "0.1.0"
description = "Multi-feed pedestrian/vehicle counting over local video files, each feed pinnable to its own compute device -- built by composing the object-detection brick, not re-wrapping a detector a second time."
requires-python = ">=3.11"
dependencies = [
    "pantherlake-ai-core",
    "object-detection",
    "numpy>=1.26",
    "opencv-python>=4.9",
    # Resolves a YouTube live page to the HLS stream behind it, for the
    # public street cameras in samples.py. Pure Python and small; YouTube
    # changes often enough that this wants to stay current.
    "yt-dlp>=2024.1",  # imported directly (draw.py, cli.py), not just via core
]

[project.optional-dependencies]
# Mirrors the openvino extra of the brick this one composes.
openvino = [
    "object-detection[openvino]",
]

[project.scripts]
smart-city-monitor = "smart_city_monitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_city_monitor"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
object-detection = { workspace = true }
