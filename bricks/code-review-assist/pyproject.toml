[project]
name = "code-review-assist"
version = "0.1.0"
description = "Turns a working-tree git diff into a conventional-commit message and review notes using a local LLM -- composes doc-qa's engine_factory, no LLM code of its own."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "doc-qa",
]

[project.optional-dependencies]
# Mirrors the openvino extra of the one brick this one composes.
openvino = [
    "doc-qa[openvino]",
]

[project.scripts]
code-review-assist = "code_review_assist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_assist"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
doc-qa = { workspace = true }
