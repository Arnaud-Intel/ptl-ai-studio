[project]
name = "voice-assistant"
version = "0.1.0"
description = "Hands-free local voice assistant: wake word, speech-to-text, a small local LLM, and text-to-speech -- no cloud round trip."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "live-translation",
    "doc-qa",
    "voice-clone-studio",
    "openwakeword>=0.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
openvino = [
    "live-translation[openvino]",
    "doc-qa[openvino]",
    "voice-clone-studio[openvino]",
]

[project.scripts]
voice-assistant = "voice_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
live-translation = { workspace = true }
doc-qa = { workspace = true }
voice-clone-studio = { workspace = true }
