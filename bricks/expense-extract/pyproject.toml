[project]
name = "expense-extract"
version = "0.1.0"
description = "Batch receipt-to-CSV expense extraction: a genuinely concurrent two-stage pipeline (OCR + LLM structuring) that pins each stage to a different device."
requires-python = ">=3.10"
dependencies = [
    "pantherlake-ai-core",
    "screen-ocr",
    "doc-qa",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
openvino = [
    "screen-ocr[openvino]",
    "doc-qa[openvino]",
]

[project.scripts]
expense-extract = "expense_extract.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_extract"]

[tool.uv.sources]
pantherlake-ai-core = { workspace = true }
screen-ocr = { workspace = true }
doc-qa = { workspace = true }
