name: Bump version on main

# Runs after every push to main -- in practice, after every PR merge, since
# that's how commits land on a protected main branch. Bumps the PATCH
# component of the root VERSION file (the launcher's /api/version route
# reads it, and the footer displays it), commits that bump back, and tags
# the commit vX.Y.Z.
#
# A release that is more than the next patch is asked for in the commit
# message: a push whose last commit says "[version X.Y.Z]" is given that
# number, provided it is higher than the one in hand. The bot's commit and
# tag are the same as for any other push, so the in-app update window, which
# lists changes under the bump that followed them, needs nothing else.
#
# The `github.actor != 'github-actions[bot]'` guard exists so this
# workflow's own bump commit can't re-trigger itself into an infinite
# loop, in case a repo's settings ever change GitHub's default (pushes
# made with the built-in GITHUB_TOKEN don't normally re-trigger `on: push`
# workflows) -- belt and suspenders, not a workaround for an observed bug.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Number the version
        id: bump
        run: |
          current="$(cat VERSION)"
          IFS='.' read -r major minor patch <<< "$current"
          new="$major.$minor.$((patch + 1))"
          asked="$(git log -1 --format=%B | grep -oE '\[version [0-9]+\.[0-9]+\.[0-9]+\]' | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ -n "$asked" ] && [ "$asked" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$asked" | sort -V | tail -n 1)" = "$asked" ]; then
            new="$asked"
          fi
          echo "$new" > VERSION
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"
