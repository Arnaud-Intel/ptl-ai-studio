name: Tests

# The pure-logic and API-contract tests in tests/ -- nothing here needs an
# Intel NPU/GPU, a camera, a microphone, or a downloaded model. Runs on
# every push and pull request (the version-bump bot's own commits carry
# `[skip ci]`, so they don't).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the shared libraries the bricks' native wheels load at import time
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libgl1 libglib2.0-0

      # 3.11, not something newer: voice-assistant's wake-word model pulls
      # openwakeword, which on Linux (only) depends on tflite-runtime, whose
      # newest release ships no wheels past cp311. Windows never installs
      # that package, so a dev machine is free to run 3.12+.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the workspace (portable engines + the dev group)
        run: uv sync

      - name: Run the tests
        run: |
          set -o pipefail
          uv run pytest --color=no 2>&1 | tee pytest.log

      # Downloading a run's log needs repo credentials; an annotation on the
      # commit doesn't. So on a failure, put the output somewhere anyone
      # looking at the red check can actually read it.
      - name: Surface the failure on the commit
        if: failure()
        run: |
          python - <<'PY'
          import pathlib
          log = pathlib.Path("pytest.log")
          text = log.read_text(errors="replace")[-6000:] if log.exists() else "(pytest produced no output)"
          print("::error title=pytest output::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
