[project]
name = "pantherlake-ai-core"
version = "0.1.0"
description = "Shared audio capture, segmentation, and inference-backend/device utilities for the Panther Lake local AI demo bricks."
requires-python = ">=3.10"
dependencies = [
    "soundcard>=0.4.3",
    "numpy>=1.26",
    "psutil>=5.9",
    "opencv-python>=4.9",
    "mss>=9.0",
    "huggingface_hub>=0.24",  # model_cache.py
]

[project.scripts]
# Download the demos' models before a show (see prefetch.py).
panther-lake-prefetch = "pantherlake_ai_core.prefetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pantherlake_ai_core"]
